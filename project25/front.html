<!DOCTYPE html>
<html>
<head>
    <title>Real Estate App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
<div id="auth">
    <h2 id="title">Login</h2>

    <!-- NAME (only for signup) -->
    <input id="name" placeholder="Enter your name" style="display:none;">

    <!-- EMAIL -->
    <input id="email" placeholder="Enter your email">

    <!-- PASSWORD -->
    <input id="password" type="password" placeholder="Enter password">

    <button onclick="handleAuth()" id="authBtn">Login</button>

    <p onclick="toggle()" id="toggleText">
        Don't have account? Signup
    </p>
</div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">

        <div class="header">
            <h2>🏡 Property Listings</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- ADD PROPERTY -->
        <div class="form-card">
            <h3>Add Property</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Title</label>
                    <input id="titleInput">
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input id="price">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input id="location">
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <input id="type">
                </div>

                <div class="form-group full-width">
                    <label>Description</label>
                    <input id="desc">
                </div>

            </div>

            <button onclick="addProperty()">Add Property</button>
        </div>

        <!-- SEARCH -->
        <input id="search" placeholder="Search by location..." onkeyup="searchProperty()">

        <!-- PROPERTY CARDS -->
        <div id="cards" class="card-container"></div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
