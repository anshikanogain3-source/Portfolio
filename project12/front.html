<!DOCTYPE html>
<html>
<head>
    <title>Attendance Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Name" style="display:none;">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="header">
            <h2>📊 Attendance Tracker</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- FORM -->
        <div class="form-card">
            <input id="student" placeholder="Student Name">
            <input id="subject" placeholder="Subject">
            <input id="date" type="date">

            <select id="status">
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
            </select>

            <button id="mainBtn" onclick="addAttendance()">Add Record</button>
        </div>

        <!-- TABLE -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
