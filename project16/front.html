<!DOCTYPE html>
<html>
<head>
    <title>Hospital Records</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Name" style="display:none;">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="header">
            <h2>🏥 Patient Records</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- FORM -->
        <div class="form-card">
            <input id="nameP" placeholder="Patient Name">
            <input id="age" placeholder="Age">
            <input id="disease" placeholder="Disease">
            <input id="doctor" placeholder="Doctor Assigned">
            <input id="date" type="date">

            <button id="mainBtn" onclick="addPatient()">Add Patient</button>
        </div>

        <!-- TABLE -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Disease</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
