<!DOCTYPE html>
<html>
<head>
    <title>Support Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Name" style="display:none;">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="header">
            <h2>🎫 Support Desk</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- FORM -->
        <div class="form-card">
            <input id="titleT" placeholder="Ticket Title">
            <input id="category" placeholder="Category (Technical, Billing...)">
            <input id="date" type="date">

            <select id="status">
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
            </select>

            <textarea id="desc" placeholder="Describe your issue..."></textarea>

            <button id="mainBtn" onclick="addTicket()">Create Ticket</button>
        </div>

        <!-- TABLE -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
