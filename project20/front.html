<!DOCTYPE html>
<html>
<head>
    <title>Product Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Name" style="display:none;">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="header">
            <h2>🛒 Product Admin Panel</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- FORM -->
        <div class="form-card">
            <input id="pname" placeholder="Product Name">
            <input id="price" placeholder="Price">
            <input id="category" placeholder="Category">
            <input id="stock" placeholder="Stock Quantity">
            <input id="image" placeholder="Image URL">

            <button id="mainBtn" onclick="addProduct()">Add Product</button>
        </div>

        <!-- PRODUCTS GRID -->
        
        <div id="productGrid" class="grid"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
