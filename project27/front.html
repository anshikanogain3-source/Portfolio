<!DOCTYPE html>
<html>
<head>
    <title>CRM System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Enter name" style="display:none;">
        <input id="email" placeholder="Enter email">
        <input id="password" type="password" placeholder="Enter password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">

        <div class="header">
            <h2>📊 CRM Dashboard</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- ADD CUSTOMER -->
        <div class="form-card">
            <h3>Add Customer</h3>

            <div class="form-grid">
                <input id="cname" placeholder="Customer Name">
                <input id="cemail" placeholder="Email">
                <input id="phone" placeholder="Phone Number">
                <input id="company" placeholder="Company">
                <input id="notes" placeholder="Follow-up Notes" class="full-width">
            </div>

            <button id="mainBtn" onclick="addCustomer()">Add Customer</button>
        </div>

        <!-- SEARCH -->
        <input id="search" placeholder="Search customer..." onkeyup="searchCustomer()">

        <!-- TABLE -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>Notes</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
