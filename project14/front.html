<!DOCTYPE html>
<html>
<head>
    <title>Notes Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Name" style="display:none;">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="header">
            <h2>📚 Notes Sharing Hub</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- FORM -->
        <div class="form-card">
            <input id="subject" placeholder="Subject">
            <input id="topic" placeholder="Topic">
            <input id="author" placeholder="Author Name">
            <input id="file" placeholder="File Link (optional)">
            <textarea id="desc" placeholder="Description / Content"></textarea>

            <button id="mainBtn" onclick="addNote()">Add Note</button>
        </div>

        <!-- NOTES LIST -->
        <div id="notesContainer"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
