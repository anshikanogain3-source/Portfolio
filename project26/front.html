<!DOCTYPE html>
<html>
<head>
    <title>Freelancer Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Enter your name" style="display:none;">
        <input id="email" placeholder="Enter email">
        <input id="password" type="password" placeholder="Enter password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">

        <div class="header">
            <h2>💼 Freelancer Marketplace</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- ADD PROJECT -->
        <div class="form-card">

            <h3>Post New Project</h3>

            <div class="form-grid">
                <input id="titleInput" placeholder="Project Title">
                <input id="budget" placeholder="Budget ₹">
                <input id="deadline" type="date">
                <input id="skills" placeholder="Skills (e.g. JS, Python)">
                <input id="desc" placeholder="Description" class="full-width">
            </div>

            <button id="mainBtn" onclick="addProject()">Post Project</button>
        </div>

        <!-- PROJECT CARDS -->
        <div id="cards" class="card-container"></div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
