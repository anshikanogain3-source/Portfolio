<!DOCTYPE html>
<html>
<head>
    <title>Movie Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Name" style="display:none;">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="header">
            <h2>🎬 Movie Collection</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- SEARCH -->
        <div class="search-bar">
            <input id="searchInput" placeholder="Search movie...">
            <button onclick="searchMovie()">Search</button>
        </div>

        <!-- FORM -->
        <div class="form-card">
            <input id="titleMovie" placeholder="Title">
            <input id="genre" placeholder="Genre">
            <input id="year" placeholder="Year">
            <input id="rating" placeholder="Rating (1-10)">
            <input id="director" placeholder="Director">

            <button id="mainBtn" onclick="addMovie()">Add Movie</button>
        </div>

        <!-- TABLE -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Year</th>
                        <th>Rating</th>
                        <th>Director</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
