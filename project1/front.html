<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div class="card" id="authSection">
        <h2 id="formTitle">Login</h2>

        <input type="text" id="authName" placeholder="Name" style="display:none;">
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPassword" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Submit</button>

        <p id="toggleText">
            Don't have an account?
            <a href="#" onclick="toggleForm()">Signup/Login</a>
        </p>

        <p id="authMsg"></p>
    </div>


    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard" style="display:none;">

        <div class="top-bar">
            <h2>Student Dashboard</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- FORM -->
        <div class="form-box">
            <h3>Add / Edit Student</h3>

            <input type="text" id="name" placeholder="Name">
            <input type="text" id="roll" placeholder="Roll Number">
            <input type="text" id="class" placeholder="Class">
            <input type="email" id="email" placeholder="Email">
            <input type="text" id="phone" placeholder="Phone">

            <button class="primary" onclick="addStudent()">Add Student</button>
        </div>

        <!-- TABLE -->
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll</th>
                        <th>Class</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
