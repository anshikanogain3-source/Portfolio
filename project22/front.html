<!DOCTYPE html>
<html>
<head>
    <title>LMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- AUTH -->
    <div id="auth">
        <h2 id="title">Login</h2>

        <input id="name" placeholder="Name" style="display:none;">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="handleAuth()" id="authBtn">Login</button>
        <p onclick="toggle()" id="toggleText">Don't have account? Signup</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="header">
            <h2>🎓 LMS Dashboard</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- FORM -->
        <div class="form-card">
            <input id="titleCourse" placeholder="Course Title">
            <input id="instructor" placeholder="Instructor Name">
            <input id="duration" placeholder="Duration (e.g. 6 weeks)">
            <textarea id="desc" placeholder="Description"></textarea>
            <textarea id="modules" placeholder="Modules (comma separated)"></textarea>

            <button id="mainBtn" onclick="addCourse()">Add Course</button>
        </div>

        <!-- COURSE GRID -->
        <div id="courseGrid" class="grid"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
